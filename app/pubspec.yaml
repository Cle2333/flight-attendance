name: flight_attendance_app
description: "航班打卡 - 纯本地记录每一次起飞"
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理 + 路由
  get: ^4.6.6

  # 本地 SQLite 与桌面端 FFI
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.5.39
  path: ^1.9.1

  # 导入导出文件选择
  file_selector: ^1.0.3

  # 仅用于迁移旧版本地缓存
  shared_preferences: ^2.3.2

  # 日期格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
