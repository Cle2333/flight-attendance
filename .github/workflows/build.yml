name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    name: App · analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

  build-apk:
    name: App · build APK
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Decode release keystore (if provided)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/keystore/release.jks
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore/release.jks
          EOF
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release
      - name: Prepare versioned APK
        working-directory: app
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/flight-attendance-android-${VERSION}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/flight-attendance-android-*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-mapping
          path: app/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

  build-linux:
    name: App · build Linux
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release
      - name: Package Linux releases
        working-directory: app
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          APP=flight-attendance-app
          DIST="${GITHUB_WORKSPACE}/dist/linux"
          STAGE="${RUNNER_TEMP}/debroot"
          BUNDLE=build/linux/x64/release/bundle
          PORTABLE="${RUNNER_TEMP}/${APP}-${VERSION}"
          rm -rf "$STAGE" "$PORTABLE" "$DIST"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/${APP}" \
            "$STAGE/usr/share/applications" \
            "$STAGE/usr/share/icons/hicolor/512x512/apps" \
            "$PORTABLE" "$DIST"
          cp -r "${BUNDLE}/"* "$STAGE/opt/${APP}/"
          cp -r "${BUNDLE}/"* "$PORTABLE/"
          cp web/icons/Icon-512.png \
            "$STAGE/usr/share/icons/hicolor/512x512/apps/${APP}.png"
          cat > "$STAGE/usr/share/applications/${APP}.desktop" <<EOF
          [Desktop Entry]
          Name=航班打卡
          Comment=纯本地记录每一次起飞
          Exec=/opt/${APP}/flight_attendance_app
          Icon=${APP}
          Terminal=false
          Type=Application
          Categories=Utility;
          StartupWMClass=flight_attendance_app
          EOF
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: ${APP}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Cle2333 <Cle2333@users.noreply.github.com>
          Depends: libgtk-3-0 | libgtk-3-0t64, liblzma5, libsqlite3-0, libstdc++6
          Description: 航班打卡 - 纯本地记录每一次起飞
          EOF
          cat > "$STAGE/DEBIAN/postinst" <<'EOS'
          #!/bin/sh
          set -e
          chmod +x /opt/flight-attendance-app/flight_attendance_app
          ln -sf /opt/flight-attendance-app/flight_attendance_app /usr/local/bin/flight-attendance-app
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database /usr/share/applications || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          EOS
          chmod 755 "$STAGE/DEBIAN/postinst"
          cat > "$STAGE/DEBIAN/prerm" <<'EOS'
          #!/bin/sh
          set -e
          rm -f /usr/local/bin/flight-attendance-app
          EOS
          chmod 755 "$STAGE/DEBIAN/prerm"
          DEB="${DIST}/${APP}-linux-amd64-${VERSION}.deb"
          TARBALL="${DIST}/${APP}-linux-x64-${VERSION}.tar.gz"
          dpkg-deb --build --root-owner-group "$STAGE" "$DEB"
          tar -C "${RUNNER_TEMP}" -czf "$TARBALL" "${APP}-${VERSION}"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: App · build Windows
    needs: [analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        working-directory: app
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $source = Join-Path $env:GITHUB_WORKSPACE 'app/build/windows/x64/runner/Release'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist/windows'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $archive = Join-Path $dist "flight-attendance-windows-x64-$version.zip"
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -Force
      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [build-apk, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download app APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist/app/android
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: app-linux
          path: dist/app/linux
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: app-windows
          path: dist/app/windows
      - name: Prepare checksums and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          cd dist
          find app -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  app/.*/#  #' > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          ## 航班打卡 ${TAG_NAME}

          纯本地 Flutter 版本，数据保存在设备本机 SQLite 中，不联网、不登录、无排行榜。

          ### 下载

          - **Windows x64**：\`flight-attendance-windows-x64-${VERSION}.zip\`，解压后运行 \`flight_attendance_app.exe\`
          - **Linux x64**：\`flight-attendance-linux-amd64-${VERSION}.deb\` 或 \`flight-attendance-linux-x64-${VERSION}.tar.gz\`
          - **Android**：\`flight-attendance-android-${VERSION}.apk\`
          - **校验文件**：\`SHA256SUMS.txt\`

          Android APK 使用仓库当前配置生成；若未配置正式签名密钥，将使用 Flutter 默认测试签名。安装前请保留旧数据备份。

          完整提交记录：https://github.com/${REPOSITORY}/commits/${TAG_NAME}
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 航班打卡 ${{ github.ref_name }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/app/android/*.apk
            dist/app/linux/*.deb
            dist/app/linux/*.tar.gz
            dist/app/windows/*.zip
            dist/SHA256SUMS.txt
