name: Build & Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    name: App · analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

  build-apk:
    name: App · build APK
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Decode release keystore (if provided)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/keystore/release.jks
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore/release.jks
          EOF
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-mapping
          path: app/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

  build-linux:
    name: App · build Linux
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release
      - name: Package as .deb
        working-directory: app
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          APP=flight-attendance-app
          STAGE="${RUNNER_TEMP}/debroot"
          BUNDLE=build/linux/x64/release/bundle
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/${APP}"
          cp -r "${BUNDLE}/"* "$STAGE/opt/${APP}/"
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: ${APP}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: cmach_socket <cmach_socket@outlook.com>
          Depends: libgtk-3-0, liblzma5, libsqlite3-0
          Description: 航班打卡 - 纯本地记录每一次起飞
          EOF
          cat > "$STAGE/DEBIAN/postinst" <<'EOS'
          #!/bin/sh
          set -e
          chmod +x /opt/flight-attendance-app/flight_attendance_app
          ln -sf /opt/flight-attendance-app/flight_attendance_app /usr/local/bin/flight-attendance-app
          EOS
          chmod 755 "$STAGE/DEBIAN/postinst"
          cat > "$STAGE/DEBIAN/prerm" <<'EOS'
          #!/bin/sh
          set -e
          rm -f /usr/local/bin/flight-attendance-app
          EOS
          chmod 755 "$STAGE/DEBIAN/prerm"
          OUT="${APP}_${VERSION}_amd64.deb"
          dpkg-deb --build --root-owner-group "$STAGE" "$OUT"
          mkdir -p build/linux/x64/release
          cp "$OUT" build/linux/x64/release/
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: app/build/linux/x64/release/flight-attendance-app_*_amd64.deb
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: App · build Windows
    needs: [analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        working-directory: app/build/windows/x64/runner/Release
        run: Compress-Archive -Path ./* -DestinationPath ./flight-attendance-app-windows-x64.zip
      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app/build/windows/x64/runner/Release/flight-attendance-app-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [build-apk, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download app APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist/app
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: app-linux
          path: dist/app/linux
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: app-windows
          path: dist/app/windows
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/app/app-release.apk
            dist/app/linux/flight-attendance-app_*.deb
            dist/app/windows/flight-attendance-app-windows-x64.zip
